name: Deploy iPadOS RAID Companion to GitHub Pages

on:
  push:
    branches: [ipados]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/ipados'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify companion
        run: |
          npm ci
          npm test
          npm run test:dom
          npm run test:leveling
      - name: Prepare iPadOS site files only
        run: |
          mkdir -p _site
          cp -R site/. _site/
          touch _site/.nojekyll
          node -e "require('fs').writeFileSync('_site/deployment.json', JSON.stringify({platform:'ipados',branch:process.env.GITHUB_REF_NAME,commit:process.env.GITHUB_SHA}))"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
