name: Build PC Reader and Replay Preview
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/build-reader.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test PC components
        run: |
          python -m unittest discover -s desktop -p "test_*.py"
          python desktop/battle_runner.py --help
      - name: Install pinned build dependency
        run: python -m pip install -r desktop/requirements-build.txt
      - name: Build PC preview installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is required on the Windows build runner.' }
          ./desktop/build_windows.ps1 -PythonExe (Get-Command python).Source -InnoCompiler $compiler
      - name: Save PC preview installer
        uses: actions/upload-artifact@v4
        with:
          name: raid-companion-pc-preview-0.3.0
          path: desktop/installer-output/*.exe
          if-no-files-found: error
